<!DOCTYPE html>
<html>
  <head>
    <title>Etsy OAuth — Custom Family Gifts</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="index.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mini.css/3.0.1/mini-default.min.css">
    <link rel="stylesheet" href="./base/common.css">
    <script src="./base/api.js"></script>
    <style>
      body { max-width: 640px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; }
      label { display: block; font-weight: bold; margin-top: 16px; margin-bottom: 4px; }
      input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; font-family: monospace; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
      .hint { font-size: 13px; color: #666; margin-top: 4px; }
      #auth-section { margin-top: 24px; }
      #auth-section a button { background: #f8886d; color: white; border: none; padding: 10px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; }
      #auth-section a button:hover { background: #e57055; }
      #auth-section a { text-decoration: none; }
      #errors { color: red; font-size: 14px; margin-top: 8px; }
      #code-result { margin-top: 24px; }
      #code-result textarea { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 13px; padding: 8px; }
    </style>
  </head>
  <body>
    <h3>Etsy OAuth</h3>

    <label for="input-client-id">Client ID</label>
    <input type="text" id="input-client-id" placeholder="client_id" />

    <label for="input-code-challenge">Code Challenge</label>
    <input type="text" value="S14jT23JFuVTA84oGVf7I-scCGQicAqrZdsIrxC7_IU" id="input-code-challenge" placeholder="code_challenge" />

    <label for="input-code-verifier">Code Verifier</label>
    <input type="text" id="input-code-verifier" placeholder="code_verifier" />

    <div id="auth-section" style="margin-top:24px;">
      <a id="oauthlink" href="#" target="_blank">
        <button id="auth-btn" disabled>Auth</button>
      </a>
      <div id="errors"></div>
    </div>

    <div id="code-result"></div>

    <script>
      var urlParams = API.getUrlParams();

      var clientIdInput = document.getElementById('input-client-id');
      var codeChallengeInput = document.getElementById('input-code-challenge');
      var codeVerifierInput = document.getElementById('input-code-verifier');
      var oauthLink = document.getElementById('oauthlink');
      var authBtn = document.getElementById('auth-btn');
      var errorsDiv = document.getElementById('errors');

      // Pre-populate from URL params if present
      if (urlParams.client_id) clientIdInput.value = urlParams.client_id;
      if (urlParams.code_challenge) codeChallengeInput.value = urlParams.code_challenge;

      // Restore verifier from localStorage if returning from redirect
      var savedVerifier = localStorage.getItem('etsy_pkce_verifier');
      if (savedVerifier) codeVerifierInput.value = savedVerifier;

      function buildOauthUrl(clientId, codeChallenge) {
        var redirectUri = encodeURIComponent('https://smile.customfamilygifts.com/oauth_etsy');
        var scopes = encodeURIComponent('transactions_w transactions_r email_r listings_w listings_r profile_r shops_w shops_r');
        var url = 'https://www.etsy.com/oauth/connect?response_type=code';
        url += '&redirect_uri=' + redirectUri;
        url += '&scope=' + scopes;
        url += '&client_id=' + encodeURIComponent(clientId);
        url += '&state=superstate';
        url += '&code_challenge_method=S256';
        url += '&code_challenge=' + encodeURIComponent(codeChallenge);
        return url;
      }

      function updateLink() {
        var clientId = clientIdInput.value.trim();
        var codeChallenge = codeChallengeInput.value.trim();
        var errors = [];

        if (!clientId) errors.push('Client ID is required.');
        if (!codeChallenge) errors.push('Code Challenge is required.');
        if (!codeVerifierInput.value.trim()) errors.push('Code Verifier is required.');

        errorsDiv.textContent = errors.join(' ');

        if (errors.length === 0) {
          oauthLink.href = buildOauthUrl(clientId, codeChallenge);
          oauthLink.onclick = function() {
            localStorage.setItem('etsy_pkce_verifier', codeVerifierInput.value.trim());
          };
          authBtn.disabled = false;
          authBtn.style.opacity = '1';
        } else {
          oauthLink.href = '#';
          authBtn.disabled = true;
          authBtn.style.opacity = '0.5';
        }
      }

      clientIdInput.addEventListener('input', updateLink);
      codeChallengeInput.addEventListener('input', updateLink);
      updateLink();

      codeVerifierInput.addEventListener('input', updateLink);

      // Show returned code + verifier if present in URL
      var returnedCode = urlParams.code;
      if (returnedCode) {
        var verifierForPostman = localStorage.getItem('etsy_pkce_verifier') || '';
        localStorage.removeItem('etsy_pkce_verifier');
        var codeResult = document.getElementById('code-result');
        codeResult.innerHTML =
          '<strong>code:</strong><br><textarea rows="2">' + returnedCode + '</textarea>' +
          '<strong>verifier:</strong><br><textarea rows="2">' + verifierForPostman + '</textarea>';
      }
    </script>

  </body>
</html>
